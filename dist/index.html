    <script>
      // Ap dung theme truoc khi React mount de tranh nhay mau (FOUC)
      try {
        const saved = localStorage.getItem('pathvn.theme')
        const dark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
