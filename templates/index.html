<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - FastAPI App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .api-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .api-section h2 {
            color: #333;
            font-size: 1.3em;
            margin-bottom: 15px;
        }
        .api-link {
            display: block;
            background: #667eea;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-bottom: 10px;
            transition: background 0.3s;
        }
        .api-link:hover {
            background: #5568d3;
        }
        .button {
            background: #764ba2;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .button:hover {
            background: #653a8e;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 FastAPI Web App</h1>
        <p>Chào mừng bạn đến với ứng dụng web FastAPI cơ bản!</p>

        <div class="api-section">
            <h2>📡 API Endpoints:</h2>
            <a href="/docs" class="api-link" target="_blank">📚 API Documentation (Swagger)</a>
            <a href="/api/hello" class="api-link" target="_blank">👋 /api/hello</a>
            <a href="/api/user/1" class="api-link" target="_blank">👤 /api/user/1</a>
        </div>

        <button class="button" onclick="testAPI()">Test API Call</button>
        <div id="result"></div>
    </div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            try {
                const response = await fetch('/api/hello');
                const data = await response.json();
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<strong>Kết quả:</strong><br>${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<strong>Lỗi:</strong> ${error.message}`;
                resultDiv.style.background = '#ffebee';
            }
        }
    </script>
</body>
</html>
